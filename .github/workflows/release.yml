name: Release

# 推送到 main 时云端编译 NetGateShow.exe；如果 VERSION 里的版本号还没有对应的 tag，
# 就自动打 tag 并发布 Release（发布说明取自 release-notes/v<版本>.md）。版本号没变的推送只编译、不发布。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o NetGateShow.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: NetGateShow
          path: NetGateShow.exe
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d ' \r\n' < VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag 已发布，跳过"; exit 0; fi
          notes="release-notes/${tag}.md"
          [ -f "$notes" ] || { echo "NetGateShow ${tag}" > /tmp/n.md; notes=/tmp/n.md; }
          gh release create "$tag" NetGateShow.exe --target "$GITHUB_SHA" --title "NetGateShow ${tag}" --notes-file "$notes"
