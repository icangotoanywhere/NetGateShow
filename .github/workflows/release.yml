name: Release

# 推送 v* 标签（如 v1.0.1）时云端编译 NetGateShow.exe 并发布 Release；
# 发布说明取自 release-notes/<标签>.md（没有就用默认一句话）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o NetGateShow.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: NetGateShow
          path: NetGateShow.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="release-notes/${tag}.md"
          [ -f "$notes" ] || { echo "NetGateShow ${tag}" > /tmp/n.md; notes=/tmp/n.md; }
          gh release create "$tag" NetGateShow.exe --title "NetGateShow ${tag}" --notes-file "$notes"
